name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        goos: [linux]
        goarch: [amd64, arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" -o "gi-launcher-${{ matrix.goos }}-${{ matrix.goarch }}" .

      - name: Verify (vet + gofmt)
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || (echo "gofmt issues:"; gofmt -l .; exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gi-launcher-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gi-launcher-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*